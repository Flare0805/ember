<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ember</title>
  <style>
    html, body { margin: 0; height: 100%; background: #161618; color: #f5f5f7; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; }
    .logo { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 22px; display: block; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: rgba(235, 235, 245, 0.62); margin: 0 0 24px; line-height: 1.5; }
    button { font: inherit; font-weight: 600; font-size: 15px; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; color: #1d1206; background: linear-gradient(180deg, #ffb340, #ff7a00); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="build/icon.png" alt="">
    <h1>You're offline</h1>
    <p>Ember needs the internet the very first time it starts.<br>After that it also works offline.</p>
    <button onclick="location.href='https://flare0805.github.io/ember/'">Try again</button>
  </main>
</body>
</html>
