<!doctype html>
<html lang="en" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161618">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ember">
  <meta name="description" content="Ember — your personal journal, habit tracker, goal board, reading list, tasks and focus timer.">
  <title>Ember</title>
  <script>
    // iPhone/iPad: stop Safari from zooming in when a text field is focused (pinch-zoom still works on iOS)
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
      document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
    }
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <main class="main" id="main">
      <div class="compact-bar" id="compact" aria-hidden="true"><div><span></span></div></div>
      <div id="view"></div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
  </div>
  <div id="overlay-root"></div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/focus-engine.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/books.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/focus.js"></script>
  <script src="js/views/insights.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/health.js"></script>
  <script src="js/spotlight.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
